# =====================================================================
# ApexPath LIMS - base configuration (all environments)
# Profiles:  database = mysql (default) | dev (H2) | postgres
#            hardening = prod  (combine, e.g. SPRING_PROFILES_ACTIVE=mysql,prod)
#            logging   = json-logs (structured logs without the rest of prod)
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 2KB

spring:
  application:
    name: lims-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      pool-name: LimsHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000      # 30s to obtain a connection before failing the request
      idle-timeout: 600000           # 10m
      max-lifetime: 1800000          # 30m, below MySQL wait_timeout
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50   # loads lazy collections in batches instead of N+1
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 25
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: catalog.activeTests,catalog.testById,catalog.testByCode,catalog.referenceRanges
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=10m,recordStats

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  task:
    execution:
      thread-name-prefix: lims-async-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 20s

  modulith:
    # Re-deliver events whose listeners failed (e.g. print agent outage) after a restart
    republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness for orchestrators
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ApexPath LIMS
    description: Enterprise Pathology Laboratory Information Management System

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{user:-}] "
  level:
    lims.access: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    persistAuthorization: true
  api-docs:
    path: /v3/api-docs

lims:
  security:
    jwt:
      # Dev-only fallback. Production must supply LIMS_JWT_SECRET (>= 32 bytes); the prod profile has no default.
      secret: ${LIMS_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      expiration-minutes: ${LIMS_JWT_EXPIRATION_MINUTES:480}
      issuer: apexpath-lims
    lockout:
      max-failed-attempts: 5
      duration: PT15M
    bootstrap-admin-password: ${LIMS_BOOTSTRAP_ADMIN_PASSWORD:}
    allow-default-admin-password: true
  cors:
    allowed-origins: ${LIMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
  rate-limit:
    enabled: true
    login-requests-per-minute: 10
    api-requests-per-minute: 300
  reports:
    verify-base-url: ${LIMS_REPORT_VERIFY_BASE_URL:https://reports.apexpathlab.com}
  seed:
    demo-data: ${LIMS_SEED_DEMO_DATA:true}
  events:
    completed-retention: P7D

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lims_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:lims_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lims_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# Production hardening: no insecure defaults, no demo data, no public API explorer, JSON logs
spring:
  config:
    activate:
      on-profile: prod
server:
  forward-headers-strategy: native   # trust X-Forwarded-* from the ingress / reverse proxy
lims:
  security:
    jwt:
      secret: ${LIMS_JWT_SECRET}
    allow-default-admin-password: false
  cors:
    allowed-origins: ${LIMS_CORS_ALLOWED_ORIGINS}
  seed:
    demo-data: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
